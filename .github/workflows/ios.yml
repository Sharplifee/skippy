name: iOS build and TestFlight

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Our distribution cert is IOS_DISTRIBUTION ("iPhone Distribution").
      # Xcode 26 rejects that legacy type at signing even though Apple issues
      # it, so pin to 16.x. Both DISTRIBUTION slots on this team are held by
      # Scribbly and SquadComms and must not be revoked.
      - name: Select Xcode 16
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Build number = latest TestFlight build + 1. Never collides, never
      # needs a commit to bump.
      - name: Resolve build number
        id: bn
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pyjwt cryptography requests
          echo "$ASC_KEY_P8" > /tmp/asc.p8
          NEXT=$(/tmp/venv/bin/python <<'PY'
          import jwt,time,requests,os
          k=open("/tmp/asc.p8").read(); now=int(time.time())
          t=jwt.encode({"iss":os.environ["ASC_ISSUER_ID"],"iat":now,"exp":now+900,
                        "aud":"appstoreconnect-v1"},k,algorithm="ES256",
                       headers={"kid":os.environ["ASC_KEY_ID"],"typ":"JWT"})
          h={"Authorization":"Bearer "+t}
          a=requests.get("https://api.appstoreconnect.apple.com/v1/apps",
                         headers=h,params={"filter[bundleId]":"com.connor.skippy"}).json()
          d=a.get("data",[])
          if not d: print(1); raise SystemExit
          b=requests.get("https://api.appstoreconnect.apple.com/v1/builds",headers=h,
                params={"filter[app]":d[0]["id"],"sort":"-version","limit":1}).json().get("data",[])
          print(int(b[0]["attributes"]["version"])+1 if b else 1)
          PY
          )
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "Building build number $NEXT"

      # A fresh keychain has no WWDR intermediate, so a valid cert reports as
      # revoked. Import the CA chain BEFORE the p12, and stop the keychain
      # auto-locking mid-archive.
      - name: Set up signing
        env:
          P12: ${{ secrets.APPLE_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          PROFILE_APP: ${{ secrets.APPLE_PROVISION_PROFILE }}
          PROFILE_WIDGET: ${{ secrets.APPLE_PROVISION_PROFILE_WIDGET }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          for CA in AppleIncRootCertificate AppleWWDRCAG3 AppleWWDRCAG6 AppleRootCA-G3; do
            if curl -sfSL "https://www.apple.com/certificateauthority/$CA.cer" -o "/tmp/$CA.cer"; then
              security import "/tmp/$CA.cer" -k "$KEYCHAIN" -T /usr/bin/codesign 2>&1 | sed "s/^/  $CA: /" || true
            fi
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" >/dev/null 2>&1 || true

          echo "$P12" | base64 -d > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_APP"    | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/skippy.mobileprovision
          echo "$PROFILE_WIDGET" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/widget.mobileprovision

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Skippy.xcodeproj \
            -scheme Skippy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Skippy.xcarchive \
            CURRENT_PROJECT_VERSION=${{ steps.bn.outputs.next }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain" \
            2>&1 | tee /tmp/archive.log | grep -E "error:|\*\* ARCHIVE" || true
          if [ ! -d "$RUNNER_TEMP/Skippy.xcarchive" ]; then
            echo "=== ARCHIVE FAILED — last 80 lines ==="; tail -80 /tmp/archive.log; exit 1
          fi

      - name: Export IPA
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict>
              <key>com.connor.skippy</key><string>Skippy CI</string>
              <key>com.connor.skippy.widget</key><string>Skippy Widget CI</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Skippy.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates NO

      - uses: actions/upload-artifact@v4
        with:
          name: Skippy-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      # altool EXITS 0 EVEN WHEN THE UPLOAD IS REJECTED. Grep for ERROR or you
      # get false greens.
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          set -o pipefail
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/Skippy.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/upload.log
          if grep -q "ERROR" /tmp/upload.log; then
            echo "::error::TestFlight upload rejected — see log above."
            grep "ERROR" /tmp/upload.log
            exit 1
          fi
          echo "Uploaded build ${{ steps.bn.outputs.next }} to TestFlight."
