name: iOS build and TestFlight

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Apple now REQUIRES the iOS 26 SDK for any upload, so Xcode 26 is not
      # optional. Our cert is IOS_DISTRIBUTION ("iPhone Distribution") because
      # both Apple Distribution slots on this team are held by Scribbly and
      # SquadComms and must not be revoked.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Build number = latest TestFlight build + 1. Never collides, never
      # needs a commit to bump.
      - name: Resolve build number
        id: bn
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pyjwt cryptography requests
          echo "$ASC_KEY_P8" > /tmp/asc.p8
          NEXT=$(/tmp/venv/bin/python <<'PY'
          import jwt,time,requests,os
          k=open("/tmp/asc.p8").read(); now=int(time.time())
          t=jwt.encode({"iss":os.environ["ASC_ISSUER_ID"],"iat":now,"exp":now+900,
                        "aud":"appstoreconnect-v1"},k,algorithm="ES256",
                       headers={"kid":os.environ["ASC_KEY_ID"],"typ":"JWT"})
          h={"Authorization":"Bearer "+t}
          a=requests.get("https://api.appstoreconnect.apple.com/v1/apps",
                         headers=h,params={"filter[bundleId]":"com.connor.skippy"}).json()
          d=a.get("data",[])
          if not d: print(1); raise SystemExit
          b=requests.get("https://api.appstoreconnect.apple.com/v1/builds",headers=h,
                params={"filter[app]":d[0]["id"],"sort":"-version","limit":1}).json().get("data",[])
          print(int(b[0]["attributes"]["version"])+1 if b else 1)
          PY
          )
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "Building build number $NEXT"

      # A fresh keychain has no WWDR intermediate, so a valid cert reports as
      # revoked. Import the CA chain BEFORE the p12, and stop the keychain
      # auto-locking mid-archive.
      - name: Set up signing
        env:
          P12: ${{ secrets.APPLE_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          PROFILE_APP: ${{ secrets.APPLE_PROVISION_PROFILE }}
          PROFILE_WIDGET: ${{ secrets.APPLE_PROVISION_PROFILE_WIDGET }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          for CA in AppleIncRootCertificate AppleWWDRCAG3 AppleWWDRCAG6 AppleRootCA-G3; do
            if curl -sfSL "https://www.apple.com/certificateauthority/$CA.cer" -o "/tmp/$CA.cer"; then
              security import "/tmp/$CA.cer" -k "$KEYCHAIN" -T /usr/bin/codesign 2>&1 | sed "s/^/  $CA: /" || true
            fi
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" >/dev/null 2>&1 || true

          echo "$P12" | base64 -d > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_APP"    | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/skipper.mobileprovision
          echo "$PROFILE_WIDGET" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/widget.mobileprovision

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Skipper.xcodeproj \
            -scheme Skipper \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Skipper.xcarchive \
            CURRENT_PROJECT_VERSION=${{ steps.bn.outputs.next }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain" \
            2>&1 | tee /tmp/archive.log | grep -E "error:|\*\* ARCHIVE" || true
          if [ ! -d "$RUNNER_TEMP/Skipper.xcarchive" ]; then
            echo "=== ARCHIVE FAILED — last 80 lines ==="; tail -80 /tmp/archive.log; exit 1
          fi

      - name: Export IPA
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict>
              <key>com.connor.skippy</key><string>Skipper CI</string>
              <key>com.connor.skippy.widget</key><string>Skipper Widget CI</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Skipper.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates NO

      - uses: actions/upload-artifact@v4
        with:
          name: Skipper-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      # altool EXITS 0 EVEN WHEN THE UPLOAD IS REJECTED. Grep for ERROR or you
      # get false greens.
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          set -o pipefail
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/Skipper.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/upload.log
          if grep -q "ERROR" /tmp/upload.log; then
            echo "::error::TestFlight upload rejected — see log above."
            grep "ERROR" /tmp/upload.log
            exit 1
          fi
          echo "Uploaded build ${{ steps.bn.outputs.next }} to TestFlight."

      # Grant the internal tester directly on the new build. hasAccessToAllBuilds
      # covers this in theory, but group resolution stalled on build 1, so assign
      # explicitly. Also fires the invite so TestFlight notifies immediately.
      - name: Release to testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TESTER_EMAIL: ${{ secrets.TESTFLIGHT_TESTER_EMAIL }}
          WANT_BUILD: ${{ steps.bn.outputs.next }}
        run: |
          echo "$ASC_KEY_P8" > /tmp/asc.p8
          /tmp/venv/bin/python <<'PY'
          import jwt, time, requests, os, sys
          BASE="https://api.appstoreconnect.apple.com/v1"
          BUNDLE="com.connor.skippy"
          EMAIL=os.environ.get("TESTER_EMAIL") or "cwsharp23@icloud.com"

          def tok():
              k=open("/tmp/asc.p8").read(); now=int(time.time())
              return jwt.encode({"iss":os.environ["ASC_ISSUER_ID"],"iat":now,"exp":now+900,
                                 "aud":"appstoreconnect-v1"},k,algorithm="ES256",
                                headers={"kid":os.environ["ASC_KEY_ID"],"typ":"JWT"})
          H={"Authorization":"Bearer "+tok(),"Content-Type":"application/json"}

          app=requests.get(f"{BASE}/apps",headers=H,
                params={"filter[bundleId]":BUNDLE}).json().get("data",[])
          if not app:
              print("no app record; skipping"); sys.exit(0)
          APP=app[0]["id"]

          # Wait for THIS build specifically. Matching "newest VALID" grabs the
          # previous build, because the one just uploaded is still processing.
          WANT=os.environ.get("WANT_BUILD","").strip()
          build=None
          for attempt in range(40):
              b=requests.get(f"{BASE}/builds",headers=H,
                    params={"filter[app]":APP,"sort":"-version","limit":5}).json().get("data",[])
              mine=[x for x in b if x["attributes"]["version"]==WANT] if WANT else b[:1]
              if mine and mine[0]["attributes"]["processingState"]=="VALID":
                  build=mine[0]; break
              state = mine[0]["attributes"]["processingState"] if mine else "not yet listed"
              print(f"  waiting on build {WANT} ({state})...")
              time.sleep(15)
          if not build:
              print("build not VALID in time; testers not assigned"); sys.exit(0)
          BID=build["id"]
          print("build", build["attributes"]["version"], "is VALID")

          testers=requests.get(f"{BASE}/betaTesters",headers=H,
                params={"filter[email]":EMAIL,"limit":1}).json().get("data",[])
          if not testers:
              print("tester not found:", EMAIL); sys.exit(0)
          TID=testers[0]["id"]

          r=requests.post(f"{BASE}/builds/{BID}/relationships/individualTesters",
                headers=H,json={"data":[{"type":"betaTesters","id":TID}]})
          print("individual tester grant:", r.status_code)

          # 409 here means already assigned, which is a success, not a failure.
          if r.status_code in (200,201,204,409):
              print("tester has access to build", build["attributes"]["version"])
          else:
              print("WARNING: grant failed", r.text[:200])
          PY
