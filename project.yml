name: Skippy
options:
  bundleIdPrefix: com.connor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: XF783932R2
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    # iPhone only. iPad support drags in multitasking rules that demand a
    # 152x152 icon, all four orientations and a storyboard launch screen.
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Skippy:
    type: application
    platform: iOS
    sources:
      - Skippy
      - Shared
    dependencies:
      - target: SkippyWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.skippy
        PRODUCT_NAME: Skippy
        PROVISIONING_PROFILE_SPECIFIER: Skippy CI
        CODE_SIGN_ENTITLEMENTS: Skippy/Skippy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Skippy
        INFOPLIST_KEY_UIBackgroundModes: remote-notification fetch processing
    info:
      path: Skippy/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.connor.skippy.refresh

  SkippyWidget:
    type: app-extension
    platform: iOS
    sources:
      - SkippyWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.skippy.widget
        PRODUCT_NAME: SkippyWidget
        PROVISIONING_PROFILE_SPECIFIER: Skippy Widget CI
        CODE_SIGN_ENTITLEMENTS: SkippyWidget/SkippyWidget.entitlements
    info:
      path: SkippyWidget/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Skippy
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

# Explicit iOS-only scheme. Without one, an embedded extension plus
# `-destination generic/platform=iOS` gives "Supported platforms for the
# buildables in the current scheme is empty".
schemes:
  Skippy:
    build:
      targets:
        Skippy: all
    run:
      config: Debug
    archive:
      config: Release
