name: Skippy
options:
  bundleIdPrefix: com.connor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: XF783932R2
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Skippy:
    type: application
    platform: iOS
    sources:
      - Skippy
      - Shared
    dependencies:
      - target: SkippyWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.skippy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Skippy
        INFOPLIST_KEY_UIBackgroundModes: remote-notification fetch processing
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: Skippy/Skippy.entitlements
    info:
      path: Skippy/Info.plist
      properties:
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.connor.skippy.refresh

  SkippyWidget:
    type: app-extension
    platform: iOS
    sources:
      - SkippyWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.skippy.widget
        CODE_SIGN_ENTITLEMENTS: SkippyWidget/SkippyWidget.entitlements
    info:
      path: SkippyWidget/Info.plist
      properties:
        CFBundleDisplayName: Skippy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
